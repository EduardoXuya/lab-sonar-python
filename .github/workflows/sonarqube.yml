name: CI - Pruebas y Analisis SonarQube
on:
  push:
    branches:
      - desarrollo
  workflow_dispatch:
jobs:
  build-and-test:
    name: Pruebas Unitarias y Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar pruebas y generar reporte de cobertura
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml
      - name: Analisis de calidad con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
